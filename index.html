<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one thumb-reach column. Top = where you are in the 13 weeks, middle = what to do now, bottom = fixed tabs. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#15202B; --muted:#5B6875; --line:#D5DBE2;
  --larch:#B55A08; --ice:#2A7CA6; --done:#1C8556; --on-accent:#FFFFFF; --shadow:0 1px 2px rgba(21,32,43,.06);
  --display:"Barlow Condensed","Arial Narrow",Impact,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tab:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#17212B; --surface2:#1E2A36; --ink:#E9EEF3; --muted:#8E9BA8; --line:#2A3743;
  --larch:#F2A541; --ice:#74C7EC; --done:#4FCB8F; --on-accent:#0E151C; --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#17212B; --surface2:#1E2A36; --ink:#E9EEF3; --muted:#8E9BA8; --line:#2A3743;
  --larch:#F2A541; --ice:#74C7EC; --done:#4FCB8F; --on-accent:#0E151C; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:520px;margin-inline:auto;padding-inline:16px;padding-block:14px calc(var(--tab) + 96px);display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,.num{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:40px;line-height:.95;text-transform:uppercase}
h1 small{font-size:24px;color:var(--muted);font-weight:600}
h2{font-size:24px;line-height:1.05;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:14px}

/* header */
.head{display:flex;align-items:center;gap:14px}
.head>div:first-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--done);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:26px}
.ring b em{font-style:normal}.ring b em span{font-size:15px;color:var(--muted);font-weight:600}
.season{display:flex;gap:3px}
.season i{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.season i u{position:absolute;inset:0;background:var(--larch);background:var(--c,var(--larch));transform-origin:left center;transform:scaleX(0);will-change:transform}
.season i.now{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.season i.deload{opacity:.75}
.seasonlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.chip.good{color:var(--done);border-color:currentColor;background:transparent}
.banner{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--surface2);border:1px dashed var(--line)}

/* habits */
.hab{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;min-height:54px;border-top:1px solid var(--line)}
.hab:first-of-type{border-top:0}
.hab>span:first-child{flex:1;min-width:0;display:flex;flex-direction:column}
.hab b{font-weight:600} .hab em{font-style:normal;font-size:12.5px;color:var(--muted)}
.sw{flex:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.on .sw{background:var(--done)} .on .sw::after{transform:translateX(20px)}
.just .sw::after{animation:slide .32s cubic-bezier(.3,1.5,.5,1)}
.just:not(.on) .sw::after{animation-name:slideoff}
@keyframes slide{from{transform:translateX(0)}} @keyframes slideoff{from{transform:translateX(20px)}}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar u{display:block;height:100%;width:100%;background:var(--done);transform-origin:left center;transform:scaleX(0);will-change:transform}
.bar.accent u{background:var(--larch)}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px 8px}
.cardhead .num{font-size:20px;font-variant-numeric:tabular-nums}

/* week strip */
.strip{display:flex;align-items:center;gap:6px}
.strip .arrow{flex:none;width:34px;height:52px;border-radius:10px;font-size:20px;text-align:center;color:var(--muted)}
.strip .arrow:disabled{opacity:.25}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:0}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px;border:1px solid transparent;min-height:52px}
.day s{text-decoration:none;font-size:11px;color:var(--muted);font-weight:600}
.day b{font-family:var(--display);font-size:19px;line-height:1;min-width:30px;padding:4px 0;border-radius:999px;text-align:center}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day.train i{background:var(--line)} .day.ok i{background:var(--done)} .day.miss i{background:var(--larch)}
.day.sel{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.day.today b{background:var(--larch);color:var(--on-accent)}
.day.today s{color:var(--larch)}
.striphead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;margin-bottom:-6px}
.todaybtn{font-size:12.5px;font-weight:700;color:var(--on-accent);background:var(--larch);padding:5px 12px;border-radius:999px}

/* session */
.sesshead{padding:14px;display:flex;flex-direction:column;gap:10px}
.sesshead .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sesshead .num{font-size:22px;font-variant-numeric:tabular-nums}
.sect{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:9px 14px;background:var(--surface2);border-block:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;min-height:52px;border-top:1px solid var(--line)}
.sect+.item,.sect+.ex{border-top:0}
.item>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.item em{font-style:normal;font-size:12.5px;color:var(--muted)}
.item .dose{flex:none;font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:transparent;transition:background .2s,border-color .2s,transform .2s}
.full .tick{background:var(--done);border-color:var(--done);color:var(--on-accent)}
.part .tick{border-color:var(--done);color:var(--done)}
.just .tick{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.full b{color:var(--muted);font-weight:500}
.ex{border-top:1px solid var(--line)}
.exhead{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;min-height:56px}
.exhead>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.exhead em{font-style:normal;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{flex:none;display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .25s,transform .25s}
.dots i.f{background:var(--done)}
.exbody{padding:2px 14px 14px;display:flex;flex-direction:column;gap:11px}
.hint{font-size:13px;padding:8px 10px;border-radius:9px;background:var(--surface2)}
.hint.up{background:transparent;border:1.5px solid var(--done);color:var(--done);font-weight:600}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;flex-direction:column;gap:4px;min-width:0}
.step label{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step div{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface2)}
.step button{flex:none;width:42px;font-size:22px;text-align:center;color:var(--muted)}
.step button:active{background:var(--line)}
.step input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);text-align:center;font-family:var(--display);font-weight:700;font-size:26px;padding:6px 0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.big{display:block;width:100%;padding:14px;border-radius:12px;background:var(--larch);color:var(--on-accent);font-weight:700;font-size:16px;text-align:center;transition:transform .12s}
.big:active{transform:scale(.97)}
.big.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.big.okk{background:var(--done)}
.link{font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 0;align-self:center}
.rowbtn{display:flex;gap:8px;flex-wrap:wrap}
.rowbtn .big{flex:1;min-width:130px}

/* progress tab */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .num{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.grid13{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;padding:0 14px 6px}
.grid13 div{display:flex;flex-direction:column;gap:4px;align-items:center}
.grid13 i{width:100%;aspect-ratio:1;max-width:22px;border-radius:5px;background:var(--line);transition:background .4s}
.grid13 i.f{background:var(--c,var(--done))}
.grid13 s{text-decoration:none;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid13 .now s{color:var(--ink);font-weight:700}
.grid13 .deload s::after{content:"·"}
.field{display:flex;gap:8px;align-items:stretch}
.field .step{flex:1}
.field .big{width:auto;flex:none;padding-inline:18px;align-self:end}
svg.chart{display:block;width:100%;height:auto}
.lift{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.lift span:first-child{flex:1;min-width:0}
.lift b{font-variant-numeric:tabular-nums;white-space:nowrap}
.lift .d{color:var(--done);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* plan tab */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.macros div{background:var(--surface);padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.macros .num{font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.macros span{font-size:11.5px;color:var(--muted)}
.rule{padding:10px 14px;border-top:1px solid var(--line)}
.rule b{display:block}
details summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
details[open] summary::after{content:"−"}
details summary::-webkit-details-marker{display:none}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.set input{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:160px;min-width:0}

/* fixed chrome */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--larch)}
.rest{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px));z-index:4;padding:0 12px 10px;pointer-events:none}
.rest button{pointer-events:auto;display:block;width:100%;max-width:496px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px 12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.rest .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rest .num{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.rest .bar{margin-top:8px;background:color-mix(in srgb,var(--bg) 25%,transparent)}
.rest .bar u{background:var(--larch);transform:scaleX(1)}
.rest.end button{background:var(--done);color:var(--on-accent)}
.toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:6;display:grid;place-items:center;pointer-events:none;padding:0 16px}
.toast div{background:var(--done);color:var(--on-accent);font-weight:700;padding:11px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:drop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-70px);opacity:0}}
.trow{display:flex;align-items:baseline;gap:10px}
.trow .num{font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.trow .small{flex:1;min-width:0}
.trow .link{padding:4px 0;align-self:auto}
.work{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:8px 16px;border-radius:999px;background:var(--ice);color:var(--on-accent);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.work span:first-child{font-size:13px;font-weight:600;min-width:0}
.work .num{font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.warn{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--surface);border:2px solid var(--larch)}
.warn h2{color:var(--larch)}
.bk{display:block;width:100%;margin-top:8px;font:inherit;font-size:12px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px}
.sync{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="view"></div>
<div class="rest" id="rest" hidden><button data-act="reststop" aria-label="Chiudi il timer di recupero">
  <div class="row"><span id="restlab">Recupero</span><span class="num" id="restnum">0:00</span></div>
  <div class="bar"><u id="restbar"></u></div></button></div>
<div class="toast" id="toast" hidden><div id="toasttxt"></div></div>
<nav class="tabs" aria-label="Sezioni"><div>
  <button data-act="tab" data-t="oggi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Oggi</button>
  <button data-act="tab" data-t="progressi"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Progressi</button>
  <button data-act="tab" data-t="piano"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Piano</button>
</div></nav>

<script>
(function(){
"use strict";
/* ---------- programma ---------- */
var WEEKS=13, DELOAD={7:1,11:1};

var POST_LOW=[["Flessori dell'anca in affondo","2 × 45 s per lato","Gluteo contratto, bacino in retroversione.",1],

  ["Posizione del bambino","1 × 60 s","Respira nella schiena, rilassa la zona lombare.",1]];
function X(id,name,sets,lo,hi,rir,rest,step,cue,fail,bw){return {id:id,name:name,sets:sets,lo:lo,hi:hi,rir:rir,rest:rest,step:step,cue:cue,fail:!!fail,bw:!!bw}}
var CHIN=["chin","Chin tucks al muro",3,15,30,0,60,0,"In piedi con talloni, glutei, scapole e nuca al muro. Mento indietro, spingi la nuca contro il muro e tieni 2 s a ogni rep. Cedimento = quando perdi la posizione del mento.",1,1];
var P={
 UA:{name:"Upper A",day:0,focus:"Petto alto, larghezza schiena, spalle",pre:PRE_UP,post:POST_UP,ex:[

  X("face","Face pull alla corda",2,15,20,1,60,2.5,"Per la postura. Gomiti alti, chiudi ruotando le mani all'indietro."),

  X("trioh","Estensioni tricipiti sopra la testa al cavo",3,10,15,1,90,2.5,"Costole basse, non inarcare la schiena."),

 LA:{name:"Lower A",day:1,focus:"Quadricipiti, sprint prima dei pesi",pre:PRE_LOW,post:POST_LOW,ex:[
  X("hack","Hack squat o squat",3,6,10,2,180,5,"Costole basse e addome compatto, non inarcare la schiena in risalita."),

    if(it[3]>1&&v>0&&v<it[3])startRest(150,"Sprint "+(v+1)+" di "+it[3]);else if(it[3]>1)stopRest();commitW()})},
  openex:function(d){openSet=true;openEx=openEx===d.id?"":d.id;render()},
  bump:function(d){ if(d.f==="weight"||d.f==="waist"){var inp=document.getElementById("in-"+d.f+"-"+d.id),v=(num(inp.value)||0)+ +d.d;inp.value=Math.max(0,Math.round(v*10)/10);return}
    var l=logFor(d.id);l[d.f]=Math.max(0,Math.round(((l[d.f]||0)+ +d.d)*100)/100);commit()},
  setdone:function(d){wake();withDoneCheck(function(){var s=curS(),x=findEx(d.id),l=logFor(d.id),t=tSets(vw,x);if(l.sets<t)l.sets++;
    if(l.sets>=t){var nx=P[s].ex.filter(function(y){return !exDone(vw,s,y)&&y.id!==x.id})[0];openSet=true;openEx=nx?nx.id:"";startRest(nx?x.rest:0,nx?nx.name:"")}
    else startRest(x.rest,"Serie "+(l.sets+1)+" di "+t);commitW()})},
  setundo:function(d){var l=logFor(d.id);l.sets=Math.max(0,(l.sets||0)-1);stopRest();commit()},
  manual:function(){withDoneCheck(function(){var e=entry(vw,curS(),true);e.manual=e.manual?0:1;commitW()})},
  reststop:function(){stopRest()},
  startnow:function(){S.start=iso(monday(today()));S.from=iso(today());goToday();commit()},
  wsave:function(){var v=num(document.getElementById("in-weight-w").value);if(v===null||v<30||v>250){toast("Inserisci un peso valido in kg.");return}S.weights[iso(today())]=Math.round(v*10)/10;commit()},
  msave:function(){var w=closedWeek();if(w===null)return;
    var gi=document.getElementById("in-waist-b"),pi=document.getElementById("in-weight-b"),g=gi?num(gi.value):null,p=pi?num(pi.value):null;
    if(pi&&(p===null||p<30||p>250)){toast("Inserisci un peso valido in kg.");return}
    if(gi&&(g===null||g<40||g>200)){toast("Inserisci un girovita valido in cm.");return}
    if(pi){var t=today(),last=addDays(start(),7*w-1);S.weights[iso(diff(t,last)<=0?t:last)]=Math.round(p*10)/10}
    if(gi)S.waist[w]=Math.round(g*10)/10;
    commit();toast("Misure della settimana "+w+" salvate.")},
  gsave:function(d){var v=num(document.getElementById("in-waist-"+d.id).value);if(v===null||v<40||v>200){toast("Inserisci una misura valida in cm.");return}var w=waistWeek();S.waist[w]=Math.round(v*10)/10;commit();toast("Girovita settimana "+w+" salvato.")},
  adj:function(d){S.adj=Math.max(-4,Math.min(6,S.adj+ +d.d));commit()}
};
var IN={
  kg:function(v,d){var n=num(v);if(n===null)return;logFor(d.id).kg=Math.max(0,n);commit()},
  reps:function(v,d){var n=num(v);if(n===null)return;logFor(d.id).reps=Math.max(0,Math.round(n));commit()},
  start:function(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;S.start=iso(monday(parse(v)));S.from=S.start;goToday();commit()},
  startw:function(v){var n=num(v);if(n===null||n<30||n>250)return;S.startWeight=n;commit()}
};
document.addEventListener("click",function(e){var t=e.target.closest("[data-act]");if(t&&!t.disabled&&ACT[t.dataset.act])ACT[t.dataset.act](t.dataset)});
document.addEventListener("change",function(e){var t=e.target.closest("[data-in]");if(t&&IN[t.dataset.in])IN[t.dataset.in](t.value,t.dataset)});
document.addEventListener("visibilitychange",function(){if(!document.hidden){if(iso(today())!==dayKey){goToday();render()}if(rest)tick()}});

render();
boot();
})();
</script>
